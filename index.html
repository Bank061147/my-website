<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บแรกของฉัน</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f0f4ff;
      padding: 50px;
    }
    h1 { color: #3b5bdb; }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #3b5bdb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>สวัสดีชาวโลก!</h1>
  <p>นี่คือเว็บแรกของฉันที่ออนไลน์ได้จริง</p>
  <button onclick="alert('ยินดีต้อนรับครับ!')">กดตรงนี้</button>
</body>
</html>
