<!DOCTYPE html>
<html lang="th">
<head>

  <title>แนะนำตัว | Tuangwit Jantharat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.7;
    }

    /* ส่วนหัว */
    header {
      background-color: #3b5bdb;
      color: white;
      text-align: center;
      padding: 80px 20px;
    }
    header h1 { font-size: 40px; }
    header p { font-size: 20px; margin-top: 10px; }

    /* ทุกส่วนเนื้อหา */

      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    section h2 {

      border-bottom: 3px solid #3b5bdb;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    /* ป้ายทักษะ */
    .skills { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill {
      background-color: #dbe4ff;
      color: #3b5bdb;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* ปุ่มติดต่อ */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #3b5bdb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }
    .btn:hover { background-color: #2f4ac0; }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
    }
  </style>
</head>

  </header>

    <p>cim-comsci</p>
  </section>

  <section>

    <div class="skills">

      <span class="skill">CSS</span>
      <span class="skill">JavaScript</span>
      <span class="skill">PHP</span>
